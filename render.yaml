services:
  # ── FastAPI backend ─────────────────────────────────────────────────────────
  - type: web
    name: satprep-backend
    runtime: python
    region: oregon
    plan: free
    rootDir: backend
    buildCommand: pip install -e .
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: satprep-db
          property: connectionString
      - key: DATABASE_URL_MIGRATION
        fromDatabase:
          name: satprep-db
          property: connectionString
      - key: DATABASE_URL_GRADER
        fromDatabase:
          name: satprep-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGINS
        value: '["https://sat-prep.vercel.app"]'
      - key: ENVIRONMENT
        value: production
      - key: DEBUG
        value: "false"

  # ── PostgreSQL database ──────────────────────────────────────────────────────
databases:
  - name: satprep-db
    plan: free
    region: oregon
